# nginx reverse proxy for the Automotive Analyst API (VPS).
# The frontend (analyst.scottcampbell.io) is hosted on Cloudflare Pages; only the
# API needs nginx here, at analyst-api.scottcampbell.io -> FastAPI on :8010.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/analyst-api
#   sudo ln -s /etc/nginx/sites-available/analyst-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d analyst-api.scottcampbell.io

server {
    listen 80;
    server_name analyst-api.scottcampbell.io;

    # The rate limiter keys on the caller's address, so the address headers must
    # not be forgeable. $proxy_add_x_forwarded_for APPENDS to whatever the client
    # sent, leaving an attacker-controlled first hop; setting $remote_addr
    # overwrites it outright. X-Real-IP is likewise set, never forwarded.
    client_max_body_size 64k;   # /run bodies are small; MAX_SQL_CHARS is 4000

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
